name: Validate native fast loop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: macOS native build
        if: runner.os == 'macOS'
        run: sh scripts/build-helper.sh
      - name: Windows native build
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/build-helper.ps1
      - name: Check both platform adapters
        shell: bash
        run: |
          CC_PLATFORM=darwin CC_SELFTEST_OFFLINE=1 node scripts/selftest.mjs
          CC_PLATFORM=win32 CC_SELFTEST_OFFLINE=1 node scripts/selftest.mjs
      - name: Native persistent protocol (read-only)
        if: runner.os != 'Linux'
        run: node scripts/check-native.mjs
